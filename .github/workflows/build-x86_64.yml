# 基于 coolsnowwolf/lede 官方 openwrt-ci.yml 改写
# 触发方式: push 本文件 / Actions 页面手动 Run workflow
# 产物: firmware+package+buildinfo 上传为 Artifacts，固件镜像自动发布为 Release
name: Build lede x86_64

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-x86_64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build lede x86_64 firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout lede
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Update feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: make defconfig

      - name: Download packages
        run: |
          make download -j16
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/firmware ./artifact/package ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/targets/x86/64 -maxdepth 1 -type f) ./artifact/firmware/
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-x86_64-firmware
          path: ./artifact/firmware/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-x86_64-package
          path: ./artifact/package/

      - name: Upload buildinfo artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-x86_64-buildinfo
          path: ./artifact/buildinfo/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.txt <<'NOTES'
          lede x86_64 固件（GitHub Actions 自动编译）
          - 源码: coolsnowwolf/lede@${{ github.sha }}
          - 配置: 默认配置（x86/64，内核 6.18）
          - 默认管理地址 192.168.1.1，密码 password
          NOTES
          gh release create "x86_64-build-${{ github.run_number }}" ./artifact/firmware/* \
            --title "lede x86_64 构建 #${{ github.run_number }}" \
            --notes-file release-notes.txt
